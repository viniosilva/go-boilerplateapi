[SERVICE]
  flush      1
  log_level  info

[INPUT]
  Name    forward
  Listen  0.0.0.0
  Port    24224

[OUTPUT]
  Name   stdout
  Match  *

[OUTPUT]
  Name loki
  Match *
  Uri http://loki:3100/loki/api/v1/push
  Labels {job="go-boilerplateapi-api",container_name="$container_name",compose_service="$com.docker.compose.service"}
  line_format json